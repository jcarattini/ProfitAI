  /* ============================================================
     TERMINAL FINANCIERO — NOTICIAS FINANCIERAS
     Mismo tema visual · Fondo #0A0A0A · Acento #00C896
     ============================================================ */
  :root {
    --bg: #0A0A0A;
    --panel: #121413;
    --panel-edge: #1E2522;
    --accent: #00C896;
    --up: #00C896;
    --down: #FF4D5E;
    --warn: #FFC44D;
    --text: #E8ECEA;
    --muted: #7A8580;
    --mono: "SF Mono", "Cascadia Code", "Consolas", "Roboto Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; padding-bottom: 48px; }

  header {
    border-bottom: 1px solid var(--panel-edge);
    padding: 18px 28px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; justify-content: space-between;
    position: sticky; top: 0; background: rgba(10,10,10,.92); backdrop-filter: blur(8px); z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 17px; letter-spacing: 2px; font-weight: 600; }
  .brand h1 span { color: var(--accent); }
  .brand small { color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  header time { font-size: 12px; color: var(--muted); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 28px; }

  /* ---------- CINTA DE ÚLTIMA HORA ---------- */
  .ticker-bar {
    border: 1px solid var(--panel-edge); border-left: 3px solid var(--down);
    border-radius: 6px; background: var(--panel);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; overflow: hidden; margin-bottom: 18px;
  }
  .ticker-bar .tag { font-size: 9px; letter-spacing: 1.5px; color: var(--down); font-weight: 700; flex-shrink: 0; }
  .ticker-track { white-space: nowrap; overflow: hidden; flex: 1; }
  .ticker-track span { display: inline-block; padding-right: 60px; font-size: 12px; animation: scroll 35s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---------- FILTROS ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    font-size: 10px; letter-spacing: 1.5px; color: var(--muted);
    border: 1px solid var(--panel-edge); border-radius: 99px;
    padding: 7px 14px; cursor: pointer; background: none; font-family: var(--mono); font-weight: 600;
    transition: color .2s, border-color .2s;
  }
  .chip:hover { color: var(--text); }
  .chip.active { color: var(--accent); border-color: var(--accent); }

  /* ---------- LISTA DE NOTICIAS ---------- */
  .news-list { display: grid; gap: 12px; }
  .news {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 16px 18px; transition: border-color .2s;
  }
  .news:hover { border-color: var(--accent); }
  .news-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .news-meta .src { font-size: 9px; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; }
  .news-meta .time { font-size: 10px; color: var(--muted); }
  .cat {
    font-size: 9px; letter-spacing: 1px; padding: 3px 8px; border-radius: 3px;
    border: 1px solid var(--panel-edge); color: var(--muted);
  }
  .sent { font-size: 9px; letter-spacing: 1px; padding: 3px 8px; border-radius: 3px; font-weight: 700; }
  .sent.pos { background: rgba(0,200,150,.13); color: var(--up); }
  .sent.neg { background: rgba(255,77,94,.13); color: var(--down); }
  .sent.neu { background: rgba(255,196,77,.11); color: var(--warn); }
  .news h3 { font-size: 14.5px; font-weight: 700; line-height: 1.55; margin-bottom: 7px; }
  .news p { font-size: 11.5px; color: var(--muted); line-height: 1.7; }
  .tickers { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tk {
    font-size: 9px; letter-spacing: 1px; padding: 3px 8px; border-radius: 3px;
    background: var(--bg); border: 1px solid var(--panel-edge); color: var(--text); font-weight: 600;
  }
  .empty { text-align: center; color: var(--muted); font-size: 12px; padding: 40px 0; }

  footer { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 1px; padding-top: 28px; }

  @media (max-width: 640px){
    .wrap { padding: 16px; }
    header { padding: 14px 16px; }
  }
</style>

<script>
/* ==================================================================
   🔌 NOTICIAS REALES — ALPHA VANTAGE NEWS_SENTIMENT (CONECTADO)
   ------------------------------------------------------------------
   Una sola llamada trae hasta 20 titulares reales con sentimiento
   ya calculado. Gasta 1 consulta al cargar la página.
   Si falla o se agota el límite, muestra los titulares demo.
   ================================================================== */
const API_KEY = ""; // key movida al backend
const USE_LIVE = true;

async function fetchLiveNews() {
  const url = `/api/news`;
  const res = await fetch(url);
  const data = await res.json();
  if (data["Note"] || data["Information"]) throw new Error("limit");
  if (!data.feed || !data.feed.length) throw new Error("empty");

  return data.feed.map(item => {
    // Mapear sentimiento de Alpha Vantage a nuestro sistema
    const sl = item.overall_sentiment_label || "";
    const sent = sl.includes("Bullish") ? "pos" : sl.includes("Bearish") ? "neg" : "neu";

    // Extraer tickers mencionados (máximo 4)
    const tks = (item.ticker_sentiment || [])
      .slice(0,4).map(t => t.ticker).filter(Boolean);

    // Categoría basada en los topics
    const topics = (item.topics || []).map(t => t.topic);
    const cat = topics.includes("Earnings") ? "EMPRESAS"
      : topics.includes("Technology") ? "TECNOLOGÍA"
      : topics.includes("Economy - Macro") ? "MACRO"
      : topics.includes("Financial Markets") ? "MERCADOS"
      : topics.includes("Energy & Transportation") ? "ENERGÍA"
      : "MERCADOS";

    // Tiempo transcurrido
    const pub = item.time_published; // formato: 20240611T143000
    const pubDate = new Date(
      pub.slice(0,4)+"-"+pub.slice(4,6)+"-"+pub.slice(6,8)+"T"+
      pub.slice(9,11)+":"+pub.slice(11,13)+":"+pub.slice(13,15)
    );
    const minAgo = Math.round((Date.now() - pubDate) / 60000);

    return {
      cat, src: (item.source || "NEWS").toUpperCase().slice(0,20),
      min: minAgo > 0 ? minAgo : 1,
      sent, h: item.title, p: item.summary || "",
      tks: tks.length ? tks : ["—"], live: true,
    };
  });
}

    tks:["SPX","TLT","DXY"] },

    h:"Los semiconductores lideran las subidas ante nuevos pedidos de centros de datos de IA",

const SENT_LBL = { pos:"ALCISTA", neg:"BAJISTA", neu:"NEUTRAL" };

/* ---------- Filtros ---------- */
let activeCat = "TODAS";
const filtersEl = document.getElementById("filters");

filtersEl.addEventListener("click", e=>{
  const c = e.target.dataset?.cat; if (!c) return;
  activeCat = c;
  filtersEl.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("active", ch.dataset.cat===c));
  render();
});

/* ---------- Render ---------- */
function ago(min){
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return `hace ${h} h${m?` ${m} min`:""}`;
}

let currentNews = NEWS;

function render(){
  const items = currentNews.filter(n => activeCat==="TODAS" || n.cat===activeCat);
  document.getElementById("list").innerHTML = items.length ? items.map(n=>`
    <article class="news">
      <div class="news-meta">
        <span class="src">${n.src}</span>
        <span class="time">${ago(n.min)}</span>
        <span class="cat">${n.cat}</span>
        <span class="sent ${n.sent}">${SENT_LBL[n.sent]}</span>
      </div>
      <h3>${n.h}</h3>
      <p>${n.p}</p>
      <div class="tickers">${n.tks.map(t=>`<span class="tk">${t}</span>`).join("")}</div>
    </article>`).join("")
    : `<div class="empty">No hay titulares en esta categoría por ahora.</div>`;
}

function setNews(items, isLive) {
  currentNews = items;
  const cats = ["TODAS", ...new Set(items.map(n=>n.cat))];
  filtersEl.innerHTML = cats.map(c=>`<button class="chip ${c==="TODAS"?"active":""}" data-cat="${c}">${c}</button>`).join("");
  activeCat = "TODAS";
  const breaking = items.slice(0,4).map(n=>n.h).join("  ···  ");
  document.getElementById("tickerText").textContent = breaking + "  ···  " + breaking;
  const srcTag = document.getElementById("srcTag");
  if(srcTag) srcTag.innerHTML = isLive
    ? `● <b style="color:var(--accent)">NOTICIAS EN VIVO</b> · Alpha Vantage`
    : `● NOTICIAS DEMO · datos simulados`;
  render();
}

/* ---------- Carga: datos reales o demo ---------- */
async function loadNews() {
  if (!USE_LIVE) { setNews(NEWS, false); return; }
  try {
    const live = await fetchLiveNews();
    setNews(live, true);
  } catch(e) {
    setNews(NEWS, false);
  }
}

// Inicializa con demo mientras carga la API
setNews(NEWS, false);
loadNews();

/* ---------- Reloj ---------- */
function tick(){ document.getElementById("now").textContent =
  new Date().toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"medium"}); }
tick(); setInterval(tick,1000);
</script>
